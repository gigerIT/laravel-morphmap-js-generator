name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generated-typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
          - php: '8.3'
            laravel: '^13.0'
          - php: '8.5'
            laravel: '^13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer update --with 'laravel/framework:${{ matrix.laravel }}' --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npm test
